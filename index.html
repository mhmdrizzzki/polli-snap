<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polli Snap - Text to Image Meme Maker</title>
<meta name="description" content="Fast text-to-image meme generator powered by the Pollinations image API.">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{max-width:680px;width:92%;background:#171a21;border-radius:18px;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
h1{margin:0;font-size:26px}.sub{color:#8892a8;margin:8px 0 20px}
form{display:flex;gap:8px;margin-bottom:14px}input{flex:1;padding:12px;border-radius:10px;border:1px solid #2a2f3a;background:#0f1115;color:#eee;font-size:14px}
button{padding:12px 20px;border:none;background:#ff6b6b;color:#fff;border-radius:10px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#out{min-height:320px;background:#0f1115;border-radius:12px;border:1px solid #2a2f3a;display:flex;align-items:center;justify-content:center;color:#5a6472;overflow:hidden}
#out img{max-width:100%;border-radius:10px}
.hint{color:#5a6472;font-size:12px;margin-top:12px}
.hint a{color:#8892a8}
.preset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.preset button{background:#2a2f3a;color:#eee;font-weight:400;padding:6px 12px;font-size:12px}
#keyrow{display:flex;gap:8px;margin-bottom:14px}
#keyrow input{font-size:12px}
</style>
</head>
<body>
<div class="card">
<h1>Polli Snap</h1>
<p class="sub">Text-to-image meme maker powered by Pollinations. Type a prompt, get an image.</p>

<div id="keyrow">
  <input id="k" type="password" placeholder="Paste your Pollinations API key (sk_...) — BYOP, you pay your own Pollen">
</div>

<div class="preset">
<button class="p">a smug cat with a tiny hat</button>
<button class="p">doge astronaut on the moon</button>
<button class="p">a frog drinking bubble tea</button>
</div>
<form id="f">
<input id="i" placeholder="Describe the meme image..." autocomplete="off">
<button id="b" type="submit">Generate</button>
</form>
<div id="out">Your image will appear here.</div>
<p class="hint">Powered by <b>Pollinations</b> image API · <a href="https://pollinations.ai" target="_blank" rel="noopener">pollinations.ai</a> · get a key at <a href="https://enter.pollinations.ai" target="_blank" rel="noopener">enter.pollinations.ai</a></p>
</div>
<script>
var out=document.getElementById('out'),inp=document.getElementById('i'),btn=document.getElementById('b'),keyEl=document.getElementById('k');
// remember key for the session only
try{ var sk=sessionStorage.getItem('polli_key'); if(sk) keyEl.value=sk; }catch(e){}
document.querySelectorAll('.p').forEach(function(b){b.onclick=function(){inp.value=b.textContent;}});
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var q=inp.value.trim(); if(!q) return;
  var key=(keyEl.value||'').trim();
  if(!key){ out.innerHTML='⚠ Paste your Pollinations API key first (BYOP).'; keyEl.focus(); return; }
  try{ sessionStorage.setItem('polli_key',key); }catch(e){}
  btn.disabled=true; out.innerHTML='Generating...';
  try{
    var r=await fetch('https://gen.pollinations.ai/v1/images/generations',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'flux',prompt:q,n:1,size:'1024x1024'})
    });
    var d=await r.json();
    if(!r.ok){
      var msg=(d&&d.error&&d.error.message)||('HTTP '+r.status);
      out.innerHTML='⚠ '+msg.replace(/</g,'&lt;');
    }else{
      var item=(d.data&&d.data[0])||{};
      var url=item.url||item.b64_json||'';
      if(item.b64_json && !item.url){ url='data:image/png;base64,'+item.b64_json; }
      if(url){ out.innerHTML='<img src="'+url+'" alt="generated image" />'; }
      else { out.innerHTML='⚠ No image returned: '+JSON.stringify(d).slice(0,200).replace(/</g,'&lt;'); }
    }
  }catch(err){ out.innerHTML='⚠ Error: '+String(err.message||err).replace(/</g,'&lt;'); }
  btn.disabled=false; inp.select();
});
</script>
</body>
</html>
